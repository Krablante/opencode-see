name: npm publishing is disabled

# This repository is GitHub-only. The opencode-see name on npm belongs to an
# unrelated project, so this manual workflow fails closed and documents the
# boundary without allowing a tag or button press to publish by accident.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Refuse npm publication
        run: |
          echo "This project is distributed through GitHub only." >&2
          echo "The opencode-see npm name belongs to an unrelated project." >&2
          exit 1
